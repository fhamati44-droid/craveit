name: TAMAM existing-flow result checks
on:
  push:
    branches: ['feat/tamam-existing-results-only-20261124']
  pull_request:
    paths: ['mobile/**', '.github/workflows/tamam-results-check.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx expo export --platform web
      - run: test -s dist/index.html
