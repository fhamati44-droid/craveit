name: TAMAM mobile quality gate
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/tamam-mobile-quality.yml'
  push:
    branches:
      - 'feat/tamam-simple-or-full-table-20261124'
      - 'feat/tamam-food-first-visual-20261124'
    paths:
      - 'mobile/**'
      - '.github/workflows/tamam-mobile-quality.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Test, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test order composition, totals, availability, provider and cart guards
        run: npm test
      - name: Typecheck Expo application
        run: npm run typecheck
      - name: Build production web bundle
        run: npx expo export --platform web
      - name: Confirm SPA output exists
        run: test -s dist/index.html
